/* ---- gerçek uygulama hissi ---- */
html,body{overscroll-behavior-y:none}
button,.tw,.tile,.opt,.cell,a{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.clb,.spbtns button,.spcall,.ybtn,.mic,.obo,.gseg button,.avopt,.seg button,.nav .back,.gx,.plcard,.mehead,.splink,.cbtools button,.nav .rulebtn{transition:transform .32s var(--spring),opacity .2s,background-color .2s}
.nav .back.is-down,.gx.is-down,.nav .rulebtn.is-down,.splink.is-down{opacity:.45;transform:none!important}
.clb.is-down,.mic.is-down{transform:scale(.9)!important}
.tw:active{background:color-mix(in srgb,var(--blue) 14%,transparent)}
.sw{transition:background .25s}

/* ===== NEŞELİ TEMA ===== */
:root{--sfd:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}

.joyhead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}

.lvban{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:20px;padding:14px 16px;margin:12px 0 6px;color:#fff;background:var(--lc);box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 60%,#000)}

.pnode.cur{animation:pring 1.6s ease-in-out infinite;width:86px;height:80px;font-size:32px}

.sring{position:absolute;inset:0;pointer-events:none}

.pnode:active{transform:translateY(7px);box-shadow:0 0 0 var(--side)}

/* ===== Apple tarzı renkli tema + hareket ===== */
:root{

  --green:#34c759; --red:#ff3b30; --orange:#ff9500; --pink:#ff2d55; --indigo:#5856d6; --teal:#30b0c7;

  --inf:#0066cc; --infbg:rgba(0,122,255,.12); --neu:rgba(60,60,67,.62); --neubg:rgba(118,118,128,.12);
  --bar:rgba(249,249,249,.82); --onaccent:#fff;

  --sfr:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* tema: Okyanus (varsayılan) */
  --blue:#007aff; --acc2:#5e5ce6; --grad:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 100%); --bgt:#eef3ff;
  --g1:linear-gradient(135deg,#ff9f0a,#ff5e3a); --g2:linear-gradient(135deg,#bf5af2,#5e5ce6); --g3:linear-gradient(135deg,#30d158,#0fb5ae); --g4:linear-gradient(135deg,#ff375f,#ff6482);
  --r1:#ff2d55; --r2:#a4ff00; --r3:#00d7ff;
}

.opt{border-radius:16px;border:2px solid var(--sep);border-bottom-width:4px;background:var(--card);box-shadow:none;padding:14px 16px}
.opt.is-down{transform:translateY(2px) scale(.99)!important;border-bottom-width:2px;margin-bottom:2px}
.opt.ok{border-color:#34c759;background:color-mix(in srgb,#34c759 12%,var(--card));animation:pop .45s var(--spring)}
.opt.ok .l{background:#34c759;color:#fff;font-size:0}.opt.ok .l::after{content:"✓";font-size:15px;font-weight:800}
.opt.bad{border-color:#ff3b30;background:color-mix(in srgb,#ff3b30 10%,var(--card));animation:shake .42s}
.opt.bad .l{background:#ff3b30;color:#fff;font-size:0}.opt.bad .l::after{content:"✕";font-size:13px;font-weight:800}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
/* cümle kurma kutucukları */
.tiles.ans{min-height:110px;padding:6px 0;background:repeating-linear-gradient(180deg,transparent 0 50px,var(--sep) 50px 51px,transparent 51px 56px);border-radius:0}
.tile{border-radius:12px;padding:9px 14px;font-size:17px;font-weight:600;background:var(--card);border:2px solid var(--sep);border-bottom-width:4px;box-shadow:none}
.tile.is-down{transform:translateY(2px)!important;border-bottom-width:2px;margin-bottom:2px}
.tile.used{opacity:1!important;background:var(--fill);border-color:transparent;color:transparent;pointer-events:none}
/* geri bildirim çubuğu */
.actbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);border-top:0}
.actbar.ok,.actbar.bad{animation:sheetup .42s var(--spring)}
.actbar.ok{background:color-mix(in srgb,#34c759 18%,var(--card))}.actbar.bad{background:color-mix(in srgb,#ff3b30 14%,var(--card))}
.actbar.ok .fbt{color:var(--pos)}.actbar.bad .fbt{color:var(--neg)}
.fbt{font-family:var(--sfd);font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.actbar.ok .fbt::before{content:"✓";width:30px;height:30px;border-radius:50%;background:#34c759;color:#fff;display:grid;place-items:center;font-size:17px;animation:pop .5s var(--spring)}
.actbar.bad .fbt::before{content:"✕";width:30px;height:30px;border-radius:50%;background:#ff3b30;color:#fff;display:grid;place-items:center;font-size:15px}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
/* ilerleme çubuğu */
.prog{height:8px;border-radius:4px;margin:2px auto 6px;background:var(--fill);max-width:528px}
.prog i{background:var(--grad);border-radius:4px;position:relative;transition:width .6s var(--spring)}
.prog i::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.45)}
.nav{background:var(--bar);box-shadow:0 .5px 0 var(--sep);border-bottom:0}
/* eşleştirme */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mcol{display:grid;gap:12px;align-content:start}
.mt2{background:var(--card);border-radius:16px;padding:12px 10px;font-size:17px;font-weight:600;border:2px solid var(--sep);border-bottom-width:5px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.mt2.is-down{transform:translateY(3px)!important;border-bottom-width:2px;margin-bottom:3px}
.mt2.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card));transform:translateY(-3px);box-shadow:0 8px 16px color-mix(in srgb,var(--blue) 25%,transparent)}
.mt2.good{border-color:#34c759;background:color-mix(in srgb,#34c759 16%,var(--card));animation:pop .4s var(--spring)}
.mt2.done{animation:vanish .45s var(--ease) forwards;pointer-events:none}
@keyframes vanish{to{opacity:.25;transform:scale(.92);border-color:transparent;background:var(--fill)}}
.mt2.wrong{border-color:#ff3b30;background:color-mix(in srgb,#ff3b30 12%,var(--card));animation:shake .42s}
/* sekme çubuğu */
.tabbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);border-top:0}
.tabbar button{font-size:10px;color:var(--label2)}
.tabbar button[aria-current="page"]{color:var(--blue)}
.tabbar button[aria-current="page"] svg{animation:bounce .5s var(--spring)}
@keyframes bounce{0%{transform:scale(.7)}100%{transform:scale(1)}}
.badge{background:#ff3b30}
@media(min-width:900px){
  body.hasnav #root{padding-left:240px}
  .tabbar{top:calc(54px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:240px;box-shadow:.5px 0 0 var(--sep);padding-top:12px}
  .tabbar .in{flex-direction:column;max-width:none;padding:0 10px;gap:2px}
  .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 14px;font-size:16px;border-radius:12px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{background:color-mix(in srgb,var(--blue) 12%,transparent)}
  .tabbar button .badge{position:static;margin-left:auto}
  .tabbar button svg{flex:none}
  .badge{position:static;margin-left:auto}
  body.hasnav .page{padding-bottom:40px}
}

.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}

/* ===== Almanca okunuş (Türkçe harflerle) ===== */
function g2p(word){if(LANG.code!=="de")return "";
  let w=String(word).toLowerCase().replace(/[^a-zäöüß]/g,"");if(!w)return "";
  const V="aeiouäöüy";let o="";
  const rep=[["tsch","ç"],["sch","ş"],["chs","ks"],["ck","k"],["ph","f"],["th","t"],["qu","kv"],["tz","ts"],["dt","t"],["ß","s"],["ss","s"],["ie","i:"],["ei","ay"],["ey","ay"],["ai","ay"],["eu","oy"],["äu","oy"],["au","au"],["aa","a:"],["ee","e:"],["oo","o:"],["ah","a:"],["eh","e:"],["ih","i:"],["oh","o:"],["uh","u:"],["äh","e:"],["öh","ö:"],["üh","ü:"]];
  let i=0;
  while(i<w.length){
    if(i===0&&/^s[pt]/.test(w)){o+="ş";i+=1;continue;}
    let hit=false;
    for(const [a,b] of rep){if(w.startsWith(a,i)){o+=b;i+=a.length;hit=true;break;}}
    if(hit)continue;
    const c=w[i],prev=w[i-1]||"",next=w[i+1]||"";
    if(c==="c"&&next==="h"){o+=/[aou]/.test(prev)?"h":"ş";i+=2;continue;}
    if(c==="s"&&V.includes(next)&&(i===0||V.includes(prev)||/[lnrm]/.test(prev)))o+="z";
    else if(c==="z")o+="ts";
    else if(c==="w")o+="v";
    else if(c==="v")o+="f";
    else if(c==="j")o+="y";
    else if(c==="y")o+="ü";
    else if(c==="x")o+="ks";
    else if(c==="c")o+=/[ei]/.test(next)?"ts":"k";
    else if(c==="ä")o+="e";
    else if(c==="h"&&i>0)o+="";
    else o+=c;
    i++;
  }
  o=o.replace(/([bdfgklmnprt])\1/g,"$1").replace(/ng$/,"ng@").replace(/er$/,"ır").replace(/en$/,"ın").replace(/el$/,"ıl").replace(/ig$/,"iş").replace(/b$/,"p").replace(/d$/,"t").replace(/g$/,"k").replace(/ng@$/,"ng").replace(/::/g,":");
  return o;
}

function recStart(onText,onEnd){

  const srGo=()=>{let r;try{r=new SRC();}catch(e){REC.on=false;onEnd&&onEnd();return;}
    REC.sr=r;r.lang=LANG.loc;r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    r.onresult=e=>{let t="",fin=false;for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}onText(t.trim(),fin);};
    let live=false,ended=false;const bad=()=>{if(REC.bad)return;REC.bad=true;toast("Bu ekranda mikrofon kullanılamıyor. Yazı kutusuna dokunup klavyedeki 🎤 ile söyleyebilirsin.");};

const wtok=s=>(String(s).match(/[\p{L}\p{N}]+(?:['’][\p{L}]+)*/gu)||[]);
const wn=w=>norm(w).replace(/['’]/g,"");
function wcompare(target,heard){
  const T=wtok(target),Tn=T.map(wn),H=wtok(heard).map(wn),n=Tn.length,m=H.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=wclose(Tn[i],H[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  const cl=new Array(n).fill(false);while(i<n&&j<m){if(wclose(Tn[i],H[j])){ok[i]=true;cl[i]=Tn[i]!==H[j];i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  return{T,ok,cl,sc:n?ok.filter(Boolean).length/n:0};
}
function spItems(u,n){
  let src=u?[u]:UNITS.filter(x=>S.pass[x.key]||(S.lp&&S.lp[x.key]));
  if(!src.length)src=UNITS.filter(x=>x.lv===(S.lv||"A1")).slice(0,3);
  const seen=new Set();
  const all=src.flatMap(x=>[...(x.sents||[]),...x.w.filter(w=>w[3]).map(w=>[w[3],w[4]])]).filter(s=>{if(!s||!s[0]||!s[1]||seen.has(s[0]))return false;seen.add(s[0]);const k=wtok(s[0]).length;return k>=2&&k<=12;});
  return shuffle(all).slice(0,n);
}

function wordMatcher(w){
  if(LANG.code!=="de")return wordMatcherG(w);
  let b=noArt(w).replace(/^sich /i,"").trim();
  const low=b.toLowerCase();
  if(low.includes(" ")||low.includes("…"))return s=>s.toLowerCase().includes(low.split("…")[0].trim());
  const verb=/^[a-zäöüß]/.test(b)&&/(en|ern|eln)$/.test(low)&&low.length>4;
  let stem=verb?low.replace(/(en|n)$/,""):low;
  let pre=null,rest=null;
  if(verb)for(const p of SEP)if(stem.startsWith(p)&&stem.length>p.length+2){pre=p;rest=stem.slice(p.length);break;}
  const minStem=stem.length>=4?stem:low;
  return s=>{const t=(s.toLowerCase().match(/[a-zäöüß]+/g)||[]);
    if(t.some(x=>x===low||(minStem.length>=4&&x.startsWith(minStem))))return true;
    if(pre&&t.includes(pre)&&t.some(x=>x.startsWith(rest.slice(0,Math.max(3,rest.length-1)))))return true;
    if(verb&&t.some(x=>x==="ge"+stem+"t"||x.startsWith("ge"+stem)))return true;
    return false;};
}

  function words(sg){

function tokenize(s){return s.replace(/\s+([?!:;»])/g," $1").split(" ").filter(Boolean);}
function qWord(w,pool){

function seenPool(){
  const ws=new Map(),ss=new Map();
  const addW=(fr,tr,pr)=>{if(!fr||!tr||fr.includes("…"))return;const k=fr;if(!ws.has(k))ws.set(k,{fr,tr,pr:pr||""});};
  const addS=(t,tr)=>{if(!t||!tr)return;const n=wtok(t).length;if(n<3||n>14)return;if(!ss.has(t))ss.set(t,{t,tr});};
  BW.forEach(w=>{if(S.items[w.fr])addW(w.fr,w.tr,w.pr);});
  UNITS.forEach(u=>{if(!(S.pass[u.key]||(S.lp&&S.lp[u.key])))return;u.w.forEach(w=>{addW(w[0],w[1],w[2]);addS(w[3],w[4]);});(u.sents||[]).forEach(s=>addS(s[0],s[1]));(u.p||[]).forEach(p=>addS(p[0],p[1]));});
  return{ws:[...ws.values()],ss:[...ss.values()]};
}
let CTXIDX=null;
function ctxFor(fr){
  if(!CTXIDX){CTXIDX=new Map();const all=[];UNITS.forEach(u=>{u.w.forEach(w=>{if(w[3]&&w[4])all.push([w[3],w[4]]);});(u.sents||[]).forEach(s=>all.push(s));});
    all.forEach(([t,tr])=>{const n=wtok(t).length;if(n<3||n>14)return;wtok(t).forEach(x=>{const k=x.toLowerCase();if(!CTXIDX.has(k))CTXIDX.set(k,[]);const a=CTXIDX.get(k);if(a.length<6)a.push([t,tr]);});});}
  const base=noArt(fr);if(/\s/.test(base))return null;const a=CTXIDX.get(base.toLowerCase());if(!a||!a.length)return null;
  const [t,tr]=a[Math.random()*a.length|0];const re=new RegExp("(^|[^\\p{L}])("+base.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\p{L}])","iu");const m=t.match(re);if(!m)return null;
  const i=m.index+m[1].length;return{q:t.slice(0,i)+"___"+t.slice(i+m[2].length),full:t,tr,ans:m[2]};
}

function whyWrong(user,correct){user=String(user||"").trim();if(!user)return"";const U=toks(user).filter(isW),C=toks(correct).filter(isW);if(!C.length)return"";
  const n=U.length,m=C.length,d=[...Array(n+1)].map(()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)d[i][0]=i;for(let j=0;j<=m;j++)d[0][j]=j;
  const same=(a,b)=>a.toLowerCase()===b.toLowerCase();
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(same(U[i-1],C[j-1])?0:1));
  const ops=[];let i=n,j=m;while(i>0||j>0){if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(same(U[i-1],C[j-1])?0:1)){if(!same(U[i-1],C[j-1]))ops.unshift({u:U[i-1],c:C[j-1],j:j-1});i--;j--;}
    else if(j>0&&d[i][j]===d[i][j-1]+1){ops.unshift({u:null,c:C[j-1],j:j-1});j--;}else{ops.unshift({u:U[i-1],c:null});i--;}}
  if(!ops.length){const ur=U.map(x=>x.toLowerCase()).join(" "),cr=C.map(x=>x.toLowerCase()).join(" ");if(ur===cr)return"";}
  let an=null;try{an=xAnalyze(correct);}catch(e){}
  const tokAt=j=>an&&an.T?an.T[j]:null;
  const li=[];
  // sıra hatası: aynı kelimeler, farklı sıra
  const su=[...U].map(x=>x.toLowerCase()).sort().join(" "),sc=[...C].map(x=>x.toLowerCase()).sort().join(" ");
  if(su===sc&&U.length===C.length){let hint="Kelimeler doğru, <b>sıra</b> yanlış.";if(an&&an.main&&an.main.fin)hint+=an.clauses.some(c=>c.sub)?" Yan cümlede çekimli fiil <b>en sonda</b> olmalı.":an.ty==="JN"?" Evet/hayır sorusunda fiil <b>en başta</b>.":an.ty==="A"?` Ana cümlede çekimli fiil (<b>${esc(an.main.fin.w)}</b>) <b>2. yerde</b> olmalı.`:"";return `<div class="xwhy"><b>Neden yanlış?</b><ul><li>${hint}</li></ul></div>`;}
  ops.slice(0,4).forEach(o=>{const t=o.c!==null&&o.j!==undefined?tokAt(o.j):null;let why="";
    if(t&&LANG.code==="de"){const c=an.clauses[t.cl]||{};const ns=xWordNotes(t,c,an).filter(x=>!/^anlamı/.test(x));why=ns.slice(0,2).join(" · ");}
    else if(t&&t.tr)why="anlamı: "+esc(t.tr);
    if(o.u&&o.c){const close=wclose?wclose(o.u.toLowerCase(),o.c.toLowerCase()):false;li.push(`<b class="bad">${esc(o.u)}</b> → <b class="good">${esc(o.c)}</b>${close?" (yazım farkı)":""}${why?`<br><span class="sub">${why}</span>`:""}`);}
    else if(o.c)li.push(`eksik: <b class="good">${esc(o.c)}</b>${why?`<br><span class="sub">${why}</span>`:""}`);
    else if(o.u)li.push(`fazla: <b class="bad">${esc(o.u)}</b>`);});
  return li.length?`<div class="xwhy"><b>Neden yanlış?</b><ul>${li.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"";}

    if(has(["kann","kannst","können","könnt","muss","musst","müssen","müsst","will","willst","wollen","möchte","möchtest","möchten","soll","sollst","sollen","darf","darfst","dürfen"]))why.push("Modal fiil (können, müssen, wollen…) 2. sırada; asıl fiil <b>mastar halinde en sonda</b>.");
    if(has(["habe","hast","hat","haben","habt","bin","bist","ist","sind","seid"])&&/^(ge.+(t|en)|.+(iert))$/i.test(ws[ws.length-1]||""))why.push("Perfekt (geçmiş): haben/sein 2. sırada, <b>ge-…-t / ge-…-en</b> hali en sonda.");
    if(/^(an|auf|aus|ein|mit|zu|ab|vor|zurück|weg|los|nach|fern|her|hin|um|fest)$/i.test(ws[ws.length-1]||""))why.push("Ayrılabilen fiil: ön ek (an, auf, mit…) koparak <b>cümlenin sonuna</b> gider (anrufen → Ich rufe dich an).");
    if(has(["nicht","kein","keine","keinen","keinem"]))why.push("<b>kein</b> isimleri, <b>nicht</b> fiil/sıfat/geri kalanı olumsuz yapar.");
    if(has(["den","einen","meinen","deinen"]))why.push("<b>den/einen</b>: eril isim nesne olunca (Akkusativ) der → den, ein → einen olur.");
    if(has(["dem","einem","meinem","der"])&&has(["mit","bei","von","zu","aus","nach","seit","in","an","auf"]))why.push("mit, bei, von, zu, aus… sonrası <b>Dativ</b>: der/das → dem, die → der.");}
  else if(L==="en"){why.push("İngilizce sırası: <b>Özne + Fiil + Nesne + Yer + Zaman</b>.");
    if(q)why.push("Soru: yardımcı fiil (do/does/did/is/can…) özneden <b>önce</b> gelir.");
    if(has(["have","has"])&&ws.some(w=>/(ed|en|wn)$/.test(w)))why.push("Present perfect: have/has + fiilin 3. hali.");
    if(ws.some(w=>/ing$/.test(w))&&has(["am","is","are","was","were"]))why.push("Şimdiki/sürekli zaman: be + fiil-ing.");
    if(has(["not","don't","doesn't","didn't","never"]))why.push("Olumsuz: do/does/did + not + fiil.");}
  else if(L==="fr"){why.push("Fransızca sırası: <b>Özne + Fiil + Nesne</b>; zamir nesneler (le, la, lui…) fiilden <b>önce</b> gelir.");
    if(has(["ne","n"])&&has(["pas","jamais","plus","rien"]))why.push("Olumsuz: <b>ne + fiil + pas</b> fiili sarar.");
    if(q)why.push("Soru: 'est-ce que' + normal cümle ya da fiil-özne yer değiştirir.");
    if(has(["ai","as","a","avons","avez","ont","suis","es","est","sommes","êtes","sont"]))why.push("Passé composé: avoir/être + participe (parlé, allé). Hareket fiilleri être alır.");}
  else if(L==="it"){why.push("İtalyancada sıra: <b>Özne + Fiil + Nesne</b>; özne çoğu zaman <b>düşer</b> çünkü fiilin eki kimin yaptığını söyler (parlo = ben konuşurum).");
    if(has(["non"]))why.push("Olumsuz: fiilden önce <b>non</b>.");
    if(has(["ho","hai","ha","abbiamo","avete","hanno","sono","sei","è","siamo","siete"]))why.push("Passato prossimo: avere/essere + participio (parlato, andato).");
    if(has(["del","della","nel","nella","al","alla","dal","sul"]))why.push("Edat + artikel birleşir: di+il = del, in+la = nella.");}
  return {parts:ws.map(w=>{const r=findLex(w);return {t:w,r:"X",n:r?r.e.tr:""};}),why,off:true};}
function yRender(s,j){const parts=(j.parts||[]).filter(p=>p&&p.t);
  const leg=[...new Set(parts.map(p=>p.r))].filter(r=>YROLE[r]&&r!=="X");
  return `<div class="h2" style="font-size:22px;margin-bottom:4px">🧩 Cümle yapısı</div>
  <div class="ybig">${tapS(s)} <button class="sbtn sm" data-say="${esc(s)}" aria-label="Dinle">${I.spk}</button></div>${j.tr?`<div class="sub">${esc(j.tr)}</div>`:""}
  <div class="yparts">${parts.map((p,i)=>{const R=YROLE[p.r]||YROLE.X;return `<div class="ypart" style="--yc:${R[1]}"><div class="ypn">${i+1}</div><b>${esc(p.t)}</b><span class="yrl">${j.off?"":esc(R[0])}</span>${p.n?`<small>${esc(p.n)}</small>`:""}</div>`;}).join("")}</div>
  ${j.formula?`<div class="yform">${esc(j.formula)}</div>`:""}
  ${(j.why||[]).length?`<div class="sec-h" style="margin-left:2px">Neden böyle?</div><div class="gram"><ul class="ywhy">${j.why.map(w=>`<li>${j.off?w:esc(w)}</li>`).join("")}</ul></div>`:""}
  ${(j.words||[]).length?`<div class="sec-h" style="margin-left:2px">Kelimeler ve artikeller</div><div class="gram"><ul class="ywhy">${j.words.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}
  ${j.try&&j.try.s?`<div class="sec-h" style="margin-left:2px">Aynı kalıpla yeni cümle</div><div class="card" style="padding:14px"><div class="wordline"><div style="flex:1"><div class="fr" style="font-weight:600">${tapS(j.try.s)}</div><div class="sub">${esc(j.try.tr||"")}</div></div><button class="sbtn sm" data-say="${esc(j.try.s)}">${I.spk}</button></div></div>`:""}
  ${j.off?`<div class="sec-f" style="margin:12px 2px 0">Kelimelere dokunarak anlamlarını gör. Ayrıntılı, parça parça anlatım Claude uygulamasındaki sürümde yapay zekâ ile yapılır.</div>`:""}
  ${ART_RULES[LANG.code]?`<button class="btn sec" id="yart" style="margin-top:14px">${LANG.code==="de"?"der/die/das":"Cinsiyet"} kurallarını gör</button>`:""}`;}
async function structSheet(s,tr,keep){s=String(s||"").trim();if(!s)return;closeGloss();
  if(!tr){const f=(typeof ALLS!=="undefined"?ALLS:[]).find(o=>lk(o.de)===lk(s));if(f)tr=f.tr;}

  const b=$("#ybox");b.scrollTop=0;const sh=b.closest(".sheet");if(sh)sh.scrollTop=0;bindTap(b);bindSay(b);
  const a=$("#yart");if(a)a.onclick=()=>{a.closest(".sheetbg").remove();artSheet();};

  const c=yGet(s);if(c)return showAI(c);
  ai.innerHTML=`<div class="sec-h" style="margin-left:2px">🤖 Öğretmen notu</div><div class="typing"><span>●</span><span>●</span><span>●</span></div>`;

  catch(e){if(e&&e.code==="not_granted")CAPS.sample=null;const x=$("#xai");if(x)x.innerHTML="";}}
