.gseg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gseg button{border:1.5px solid transparent;border-radius:14px;padding:10px 6px;background:var(--neubg);color:var(--label);font:600 15px var(--sf);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}.gseg small{font-weight:400;font-size:12px;color:var(--label2)}.gseg button[aria-pressed="true"]{border-color:var(--blue);background:var(--card)}

/* ===== Apple tarzı renkli tema + hareket ===== */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.07);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.16);
  --green:#34c759; --red:#ff3b30; --orange:#ff9500; --pink:#ff2d55; --indigo:#5856d6; --teal:#30b0c7;
  --der:#0a7aff; --die:#ff2d78; --das:#28a745;
  --pos:#248a3d; --posbg:rgba(52,199,89,.14); --crit:#c93400; --critbg:rgba(255,149,0,.16); --neg:#d70015; --negbg:rgba(255,59,48,.12);
  --inf:#0066cc; --infbg:rgba(0,122,255,.12); --neu:rgba(60,60,67,.62); --neubg:rgba(118,118,128,.12);
  --bar:rgba(249,249,249,.82); --onaccent:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --sfd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --sfr:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* tema: Okyanus (varsayılan) */
  --blue:#007aff; --acc2:#5e5ce6; --grad:linear-gradient(135deg,#0a84ff 0%,#5e5ce6 100%); --bgt:#eef3ff;
  --g1:linear-gradient(135deg,#ff9f0a,#ff5e3a); --g2:linear-gradient(135deg,#bf5af2,#5e5ce6); --g3:linear-gradient(135deg,#30d158,#0fb5ae); --g4:linear-gradient(135deg,#ff375f,#ff6482);
  --r1:#ff2d55; --r2:#a4ff00; --r3:#00d7ff;
}

  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);

/* ---------- basma efektleri (gerçek buton hissi) ---------- */
.press,.btn,.opt,.cell,.frow,.tile,.mt2,.ktile,.ocard,.cqb,.cj,.chips button,.itb button,.sbtn,.thsw,.tabbar button,.fbtn{transition:transform .32s var(--spring),box-shadow .2s var(--ease),background-color .2s,border-color .2s,opacity .2s;-webkit-user-select:none;user-select:none;touch-action:manipulation}

/* ana buton: fiziksel tuş */

/* ---------- giriş animasyonları ---------- */
.fade{animation:rise .45s var(--ease) both}

/* ---------- ortak bileşenler ---------- */
.card,.group,.hero,.stat,.cj,.cqb{border-radius:22px;box-shadow:var(--shadow)}
.pill{border-radius:999px}
.pill.indigo,.pill.blue{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.sbtn{background:var(--grad);box-shadow:0 4px 10px color-mix(in srgb,var(--blue) 35%,transparent)}

.sbtn.playing{animation:ping .9s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 50%,transparent)}100%{box-shadow:0 0 0 16px transparent}}

/* seçenekler */
.opt{border-radius:16px;border:2px solid var(--sep);border-bottom-width:4px;background:var(--card);box-shadow:none;padding:14px 16px}
.opt.is-down{transform:translateY(2px) scale(.99)!important;border-bottom-width:2px;margin-bottom:2px}
.opt.ok{border-color:#34c759;background:color-mix(in srgb,#34c759 12%,var(--card));animation:pop .45s var(--spring)}
.opt.ok .l{background:#34c759;color:#fff;font-size:0}.opt.ok .l::after{content:"✓";font-size:15px;font-weight:800}
.opt.bad{border-color:#ff3b30;background:color-mix(in srgb,#ff3b30 10%,var(--card));animation:shake .42s}
.opt.bad .l{background:#ff3b30;color:#fff;font-size:0}.opt.bad .l::after{content:"✕";font-size:13px;font-weight:800}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.tile{border-radius:12px;padding:9px 14px;font-size:17px;font-weight:600;background:var(--card);border:2px solid var(--sep);border-bottom-width:4px;box-shadow:none}
.tile.is-down{transform:translateY(2px)!important;border-bottom-width:2px;margin-bottom:2px}
.tile.used{opacity:1!important;background:var(--fill);border-color:transparent;color:transparent;pointer-events:none}
/* geri bildirim çubuğu */
.actbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);border-top:0}
.actbar.ok,.actbar.bad{animation:sheetup .42s var(--spring)}
.actbar.ok{background:color-mix(in srgb,#34c759 18%,var(--card))}.actbar.bad{background:color-mix(in srgb,#ff3b30 14%,var(--card))}
.actbar.ok .fbt{color:var(--pos)}.actbar.bad .fbt{color:var(--neg)}
.fbt{font-family:var(--sfd);font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.actbar.ok .fbt::before{content:"✓";width:30px;height:30px;border-radius:50%;background:#34c759;color:#fff;display:grid;place-items:center;font-size:17px;animation:pop .5s var(--spring)}
.actbar.bad .fbt::before{content:"✕";width:30px;height:30px;border-radius:50%;background:#ff3b30;color:#fff;display:grid;place-items:center;font-size:15px}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
/* ilerleme çubuğu */
.prog{height:8px;border-radius:4px;margin:2px auto 6px;background:var(--fill);max-width:528px}
.prog i{background:var(--grad);border-radius:4px;position:relative;transition:width .6s var(--spring)}
.prog i::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.45)}
.nav{background:var(--bar);box-shadow:0 .5px 0 var(--sep);border-bottom:0}
/* eşleştirme */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mcol{display:grid;gap:12px;align-content:start}
.mt2{background:var(--card);border-radius:16px;padding:12px 10px;font-size:17px;font-weight:600;border:2px solid var(--sep);border-bottom-width:5px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.mt2.is-down{transform:translateY(3px)!important;border-bottom-width:2px;margin-bottom:3px}
.mt2.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card));transform:translateY(-3px);box-shadow:0 8px 16px color-mix(in srgb,var(--blue) 25%,transparent)}
.mt2.good{border-color:#34c759;background:color-mix(in srgb,#34c759 16%,var(--card));animation:pop .4s var(--spring)}
.mt2.done{animation:vanish .45s var(--ease) forwards;pointer-events:none}
@keyframes vanish{to{opacity:.25;transform:scale(.92);border-color:transparent;background:var(--fill)}}
.mt2.wrong{border-color:#ff3b30;background:color-mix(in srgb,#ff3b30 12%,var(--card));animation:shake .42s}
/* sekme çubuğu */
.tabbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);border-top:0}
.tabbar button{font-size:10px;color:var(--label2)}
.tabbar button[aria-current="page"]{color:var(--blue)}
.tabbar button[aria-current="page"] svg{animation:bounce .5s var(--spring)}
@keyframes bounce{0%{transform:scale(.7)}100%{transform:scale(1)}}
.badge{background:#ff3b30}
@media(min-width:900px){
  body.hasnav #root{padding-left:240px}

  .tabbar .in{flex-direction:column;max-width:none;padding:0 10px;gap:2px}
  .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 14px;font-size:16px;border-radius:12px}
  .tabbar button svg{width:22px;height:22px}

  .badge{position:static;margin-left:auto}

}

function sfxCtx(){

  try{if(navigator.audioSession&&S.sfx!==false)navigator.audioSession.type="playback";}catch(e){}

}

function impulse(c,sec,decay){const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
/* çan sesi: temel + çan kısmi frekansları, yumuşak atak, doğal sönüm */
function bell(c,out,f,t,dur,vol){
  [[1,1,1],[2.01,.42,.62],[3.0,.18,.42],[4.17,.09,.3],[5.43,.05,.22]].forEach(([r,a,dl])=>{
    const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f*r;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur*dl);
    o.connect(g).connect(out);o.start(t);o.stop(t+dur*dl+.05);});
}
function pluck(c,out,f,t,dur,vol){
  const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;lp.type="lowpass";lp.frequency.setValueAtTime(f*6,t);lp.frequency.exponentialRampToValueAtTime(f*1.5,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const g2=c.createGain();g2.gain.value=.3;o.connect(lp);o2.connect(g2).connect(lp);lp.connect(g).connect(out);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
}
function noiseHit(c,out,t,dur,freq,q,vol){
  const n=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp).connect(g).connect(out);s.start(t);

const RECIPES={
  /* doğru: iki notalı yükselen parlak çan (Do6 → Sol6) */
  ok:[1.1,(c,dry,wet)=>{bell(c,dry,1046.5,0,.9,.22);bell(c,dry,1568,.085,1.1,.2);bell(c,wet,1568,.085,1.1,.07);}],
  /* yanlış: yumuşak, alçak "tok" ses — rahatsız etmeyen */
  bad:[.55,(c,dry,wet)=>{const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type="sine";o.frequency.setValueAtTime(330,0);o.frequency.exponentialRampToValueAtTime(155,.22);lp.type="lowpass";lp.frequency.value=900;
      g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.32,.01);g.gain.exponentialRampToValueAtTime(.0001,.34);o.connect(lp).connect(g).connect(dry);o.start(0);o.stop(.4);
      pluck(c,dry,233.1,.11,.32,.16);noiseHit(c,dry,0,.05,700,1.2,.05);}],
  /* dokunma: iOS klavye tıkı gibi kısa, yumuşak */
  tap:[.06,(c,dry)=>{noiseHit(c,dry,0,.03,2600,1.1,.4);pluck(c,dry,2093,0,.04,.03);}],
  /* eşleşme: tek, kısa ve hafif çan */
  match:[.6,(c,dry,wet)=>{bell(c,dry,1318.5,0,.55,.16);bell(c,wet,1318.5,0,.55,.05);}],
  /* ders bitti: Do-Mi-Sol-Do arpej + akor parıltısı */
  win:[2.2,(c,dry,wet)=>{[523.3,659.3,784,1046.5].forEach((f,i)=>{bell(c,dry,f,i*.11,1.0,.17);bell(c,wet,f,i*.11,1.0,.06);});
      [1046.5,1318.5,1568,2093].forEach((f,i)=>{pluck(c,dry,f,.5+i*.012,1.2,.06);bell(c,wet,f,.5,1.4,.035);});}]

async function sfxRender(){
  if(SFX.ready||SFX.rendering)return;SFX.rendering=true;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OAC){SFX.rendering=false;return;}
  const sr=SFX.ctx.sampleRate||44100;
  for(const [k,[dur,fn]] of Object.entries(RECIPES)){
    try{const len=Math.ceil(sr*(dur+.6));const oc=new OAC(2,len,sr);
      const dry=oc.createGain();dry.connect(oc.destination);
      const cv=oc.createConvolver();cv.buffer=impulse(oc,1.1,3.2);const wg=oc.createGain();wg.gain.value=.55;const wet=oc.createGain();wet.connect(cv).connect(wg).connect(oc.destination);
      fn(oc,dry,wet);SFX.bufs[k]=await oc.startRendering();}catch(e){}
  }
  SFX.ready=true;SFX.rendering=false;
}
function sfx(kind){
  if(S.sfx===false)return;
  let c=sfxCtx();if(!c)return;
  if(c.state==="closed"||c.state==="interrupted"){sfxReset();c=sfxCtx();if(!c)return;}
  const play=()=>{try{const b=SFX.bufs[kind];
      if(b){const s=c.createBufferSource();s.buffer=b;s.connect(SFX.master);s.start(c.currentTime+.005);return;}
      sfxRender();
      /* hazır değilse basit bir yedek ses */
      const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type="sine";o.frequency.value=kind==="bad"?220:kind==="tap"?1800:880;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==="tap"?.05:.15,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+(kind==="tap"?.04:.25));o.connect(g).connect(SFX.master);o.start(t);o.stop(t+.3);
    }catch(e){}};
  if(c.state==="running")return play();
  try{const p=c.resume();if(p&&p.then)p.then(()=>{if(c.state==="running")play();else{sfxReset();const c2=sfxCtx();if(c2){c=c2;c2.resume().then(play).catch(()=>{});}}}).catch(()=>{});else play();}catch(e){}
}

/* ===== Almanca okunuş (Türkçe harflerle) ===== */
function g2p(word){if(LANG.code!=="de")return "";
  let w=String(word).toLowerCase().replace(/[^a-zäöüß]/g,"");if(!w)return "";
  const V="aeiouäöüy";let o="";
  const rep=[["tsch","ç"],["sch","ş"],["chs","ks"],["ck","k"],["ph","f"],["th","t"],["qu","kv"],["tz","ts"],["dt","t"],["ß","s"],["ss","s"],["ie","i:"],["ei","ay"],["ey","ay"],["ai","ay"],["eu","oy"],["äu","oy"],["au","au"],["aa","a:"],["ee","e:"],["oo","o:"],["ah","a:"],["eh","e:"],["ih","i:"],["oh","o:"],["uh","u:"],["äh","e:"],["öh","ö:"],["üh","ü:"]];
  let i=0;
  while(i<w.length){
    if(i===0&&/^s[pt]/.test(w)){o+="ş";i+=1;continue;}
    let hit=false;
    for(const [a,b] of rep){if(w.startsWith(a,i)){o+=b;i+=a.length;hit=true;break;}}
    if(hit)continue;
    const c=w[i],prev=w[i-1]||"",next=w[i+1]||"";
    if(c==="c"&&next==="h"){o+=/[aou]/.test(prev)?"h":"ş";i+=2;continue;}
    if(c==="s"&&V.includes(next)&&(i===0||V.includes(prev)||/[lnrm]/.test(prev)))o+="z";
    else if(c==="z")o+="ts";
    else if(c==="w")o+="v";
    else if(c==="v")o+="f";
    else if(c==="j")o+="y";
    else if(c==="y")o+="ü";
    else if(c==="x")o+="ks";
    else if(c==="c")o+=/[ei]/.test(next)?"ts":"k";
    else if(c==="ä")o+="e";
    else if(c==="h"&&i>0)o+="";
    else o+=c;
    i++;
  }
  o=o.replace(/([bdfgklmnprt])\1/g,"$1").replace(/ng$/,"ng@").replace(/er$/,"ır").replace(/en$/,"ın").replace(/el$/,"ıl").replace(/ig$/,"iş").replace(/b$/,"p").replace(/d$/,"t").replace(/g$/,"k").replace(/ng@$/,"ng").replace(/::/g,":");
  return o;
}

async function capsInit(){if(CAPS.ready)return;CAPS.ready=true;
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));

function recStop(){try{if(REC.sr){REC.sr.stop();return;}}catch(e){}try{if(CAPS.dict&&REC.on)CAPS.dict.stop().catch(()=>{});}catch(e){}}
function recStart(onText,onEnd){
  stopSpeak();REC.on=true;
  if(SRC){let r;try{r=new SRC();}catch(e){REC.on=false;onEnd&&onEnd();return;}
    REC.sr=r;r.lang=LANG.loc;r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    r.onresult=e=>{let t="",fin=false;for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=true;}onText(t.trim(),fin);};
    r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("Mikrofon izni yok. Klavyedeki 🎤 ile söyleyebilirsin.");};
    r.onend=()=>{REC.on=false;REC.sr=null;onEnd&&onEnd();};
    try{r.start();}catch(e){REC.on=false;REC.sr=null;onEnd&&onEnd();}
    return;}
  if(CAPS.dict){let acc="";
    REC.p=t=>onText((acc+" "+t).trim(),false);
    REC.f=t=>{acc=(acc+" "+t).trim();onText(acc,true);};
    REC.s=st=>{if(st==="idle"){REC.on=false;REC.p=REC.f=REC.s=null;onEnd&&onEnd();}};
    CAPS.dict.start().catch(()=>{REC.on=false;REC.p=REC.f=REC.s=null;onEnd&&onEnd();});return;}
  REC.on=false;onEnd&&onEnd();
}

const wtok=s=>(String(s).match(/[\p{L}\p{N}]+(?:['’][\p{L}]+)*/gu)||[]);
const wn=w=>norm(w).replace(/['’]/g,"");
function wcompare(target,heard){
  const T=wtok(target),Tn=T.map(wn),H=wtok(heard).map(wn),n=Tn.length,m=H.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=Tn[i]===H[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ok=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(Tn[i]===H[j]){ok[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  return{T,ok,sc:n?ok.filter(Boolean).length/n:0};
}
function spItems(u,n){
  let src=u?[u]:UNITS.filter(x=>S.pass[x.key]||(S.lp&&S.lp[x.key]));
  if(!src.length)src=UNITS.filter(x=>x.lv===(S.lv||"A1")).slice(0,3);
  const seen=new Set();
  const all=src.flatMap(x=>[...(x.sents||[]),...x.w.filter(w=>w[3]).map(w=>[w[3],w[4]])]).filter(s=>{if(!s||!s[0]||!s[1]||seen.has(s[0]))return false;seen.add(s[0]);const k=wtok(s[0]).length;return k>=2&&k<=12;});
  return shuffle(all).slice(0,n);
}

  const back=()=>{recStop();stopSpeak();if(o.onBack)o.onBack();else if(o.onDone)o.onDone();else{IN_LESSON=false;tab="games";render();}};
  function show(){

    root().innerHTML=`<div class="nav"><div class="in"><button class="back" id="sx"><span style="width:22px;height:22px;display:grid;place-items:center">${I.x}</span></button><div class="nt">${esc(o.title||"Konuşma pratiği")}</div><div class="cnt">${k+1}/${items.length}</div></div><div class="prog"><i style="width:${k/items.length*100}%"></i></div></div>

    $("#skip").onclick=()=>{recStop();next();};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};
    function check(){
      if(done){next();return;}
      const v=inp.value.trim();if(!v){toast("Önce söyle ya da yaz");return;}
      const r=wcompare(tgt,v);tries++;
      res.innerHTML=(mode==="say"?`<div class="sptr" style="margin-bottom:4px">Doğrusu:</div>`:"")+r.T.map((w,i)=>`<span class="pw ${r.ok[i]?"ok":"no"}">${esc(w)}</span>`).join(" ")+
        `<div class="spsc" style="color:${r.sc>=.8?"var(--green)":r.sc>=.5?"var(--orange)":"var(--red)"}">%${Math.round(r.sc*100)} ${r.sc>=.95?"Mükemmel!":r.sc>=.8?"Çok iyi!":r.sc>=.5?"Fena değil, tekrar dene":"Bir daha dene"}</div>`+
        (mode==="say"?`<div style="margin-top:8px">${spk(tgt,true)}</div>`:"");
      bindSay(res);
      if(r.sc>=.8){done=true;good++;xp+=3;sfx("ok");dqInc("ok");chk.textContent="Devam";}
      else{sfx("bad");if(tries>=2){done=true;chk.textContent="Devam";}else{chk.textContent="Kontrol et";inp.select&&inp.select();}}
      if(mode==="say"&&!done)setTimeout(()=>say(tgt),300);
    }
    chk.onclick=check;
    bindMic($("#mic"),inp,check);
  }
  function next(){recStop();stopSpeak();k++;if(k<items.length)return show();end();}
  function end(){
    S.xp=(S.xp||0)+xp;touch();save();
    if(o.snack){toast(`🗣️ ${good}/${items.length} · +${xp} XP`);if(o.onDone)o.onDone();return;}
    window.scrollTo(0,0);if(good)setTimeout(()=>{sfx("win");},120);
    root().innerHTML=`<div class="page fade center" style="padding-top:40px;padding-bottom:160px"><div style="font-size:72px">🗣️</div><div class="h2" style="font-size:26px;margin-top:8px">${good}/${items.length} doğru</div><div class="sub">+${xp} XP · Telaffuz düzenli tekrarla gelişir.</div></div>
    <div class="actbar"><div class="in"><button class="btn sec" id="h">Bitir</button><button class="btn" id="again">Yeniden</button></div></div>`;
    $("#h").onclick=back;$("#again").onclick=()=>speakDrill(spItems(o.u||null,items.length),o);
  }
  show();
}

/* yapay zekâ ile sohbet */
let CH=null;
function chatInfo(){sheet(`<div class="h2" style="font-size:24px;margin-bottom:8px">💬 Yapay zekâ sohbeti</div><div class="sub" style="margin-bottom:10px">Sohbet, Claude uygulamasındaki sürümde çalışır (bu sayfada yapay zekâ bağlantısı yok).</div><div class="sec-f">Burada <b>Dinle ve tekrar et</b> ile <b>Çevir ve söyle</b> alıştırmalarını kullanabilirsin; ikisi de konuşmanı kontrol eder.</div>`);}
function chat(u,onBack){

function chatPrompt(){
  const u=CH.u,lv=CH.lv,words=u?u.w.slice(0,20).map(w=>w[0]).join(", "):"";
  const lvl={A1:"very short, very simple sentences, present tense, the most common words",A2:"short simple sentences, everyday vocabulary, simple past allowed",B1:"clear everyday language, some subordinate clauses",B2:"natural fluent language, varied structures",C1:"rich, idiomatic, natural language"}[lv]||"simple sentences";
  return `You are a warm, patient conversation partner inside a language-learning app (like a video-call speaking practice). The learner is a Turkish speaker practising spoken ${ENNAME} at CEFR level ${lv}.
Rules:
- Speak ONLY ${ENNAME}, using ${lvl}. Topic of the current lesson: "${u?u.t+" — "+u.s:"everyday life"}". Where natural, use some of these lesson words: ${words}.
- Each turn: react briefly and personally to what the learner said (one short sentence), then ask exactly ONE new, easy-to-answer question about the learner's own life related to the topic. Keep "say" under ${lv==="A1"?15:lv==="A2"?22:35} words.
- Check the learner's last message. Their text comes from speech-to-text, so ignore missing punctuation, capital letters and obvious transcription slips. If there is a real grammar or word mistake, put the corrected sentence in "fix" and a very short explanation in Turkish in "tip". Otherwise leave both "".
- If the learner answers in Turkish, says they don't understand, or is stuck: rephrase more simply and put a Turkish hint in "tip".
- "hint": one short example answer in ${ENNAME} the learner could give to your new question (level ${lv}).
- Answer ONLY with a JSON object, no other text: {"say":"...","tr":"Turkish translation of say","fix":"","tip":"","hint":"..."}
- When you receive the learner's ${CH.max}th answer, give feedback on it as usual, then in "say" thank them and say goodbye warmly (no question), and add "end":true and "sum":"2-3 sentences of encouraging feedback in Turkish: what went well and one thing to practise".
Start now: greet the learner briefly and ask your first question.`;
}
function parseAI(t){t=String(t||"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}return{say:t.trim(),tr:"",fix:"",tip:"",hint:""};}
function drawChat(typing){const bx=$("#cbx");if(!bx||!CH)return;
  bx.innerHTML=CH.bub.map((b,i)=>b.me?`<div class="cb me">${esc(b.t)}${b.fix?`<div class="cbf">✔ ${esc(b.fix)}${b.tip?`<br><span style="opacity:.85">${esc(b.tip)}</span>`:""}</div>`:b.ok?`<div class="cbf">👍</div>`:""}</div>`
    :`<div class="cb ai"><div>${tapS(b.t)}</div>${b.tipOnly?`<div class="cbtr">💡 ${esc(b.tipOnly)}</div>`:""}<div class="cbtools"><button data-say="${esc(b.t)}">🔊 Dinle</button>${b.tr?`<button data-tr="${i}">Türkçesi</button>`:""}${b.hint&&i===CH.bub.length-1&&!CH.ended?`<button data-hint="${i}">💡 Örnek cevap</button>`:""}</div><div class="cbtr" id="tr${i}" hidden>${esc(b.tr||"")}</div><div class="cbtr" id="hn${i}" hidden>${b.hint?esc(b.hint):""}</div></div>`).join("")+
    (typing?`<div class="cb ai typing"><span>●</span><span>●</span><span>●</span></div>`:"")+
    (CH.ended&&CH.sum?`<div class="fcard" style="margin-top:6px"><div class="fch">Değerlendirme</div><div class="sub" style="text-align:left">${esc(CH.sum)}</div><button class="btn" id="cdone" style="margin-top:12px">Bitir · +${CH.n*3+10} XP</button></div>`:"");
  bx.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say);});
  bx.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{const e=$("#tr"+b.dataset.tr);e.hidden=!e.hidden;});
  bx.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{const e=$("#hn"+b.dataset.hint);e.hidden=!e.hidden;if(!e.hidden)say(e.textContent);});
  bindTap(bx);
  const cd=$("#cdone");if(cd)cd.onclick=()=>{S.xp=(S.xp||0)+CH.n*3+10;touch();save();checkBadges&&checkBadges();sfx("win");confetti();const b=CH.back;CH=null;b();};
  const cn=$("#cnum");if(cn)cn.textContent=CH.n+"/"+CH.max;
  window.scrollTo(0,document.body.scrollHeight);
}
async function aiTurn(){
  if(!CH||CH.busy)return;CH.busy=true;drawChat(true);
  const msgs=[{role:"user",content:chatPrompt()},...CH.msgs];
  try{
    const r=await CAPS.sample(msgs,{cache:false});if(!CH)return;
    const j=parseAI(r&&r.text);CH.msgs.push({role:"assistant",content:JSON.stringify(j)});
    const last=CH.bub.length?CH.bub[CH.bub.length-1]:null;
    let tipOnly="";
    if(last&&last.me){if(j.fix&&wn(j.fix)!==wn(last.t)){last.fix=j.fix;last.tip=j.tip||"";sfx("bad");}else{last.ok=true;if(j.tip)tipOnly=j.tip;sfx("ok");}}
    else if(j.tip)tipOnly=j.tip;
    CH.bub.push({me:false,t:j.say||"…",tr:j.tr||"",hint:j.hint||"",tipOnly});
    if(j.end||CH.n>=CH.max){CH.ended=true;CH.sum=j.sum||"Harika bir sohbetti! Düzenli konuşmaya devam et.";const ab=document.querySelector(".actbar");if(ab)ab.remove();}
    CH.busy=false;drawChat(false);say(j.say||"");
  }catch(e){if(!CH)return;CH.busy=false;drawChat(false);
    const c=e&&e.code;toast(c==="rate_limited"?"Biraz bekle, sonra tekrar dene.":c==="not_granted"?"Yapay zekâ izni verilmedi.":"Bağlantı sorunu, tekrar dene.");
    if(c==="not_granted"){CAPS.sample=null;}
    if(CH.msgs.length&&CH.msgs[CH.msgs.length-1].role==="user"){CH.msgs.pop();CH.n=Math.max(0,CH.n-1);const b=CH.bub.pop();const ci=$("#ci");if(ci&&b)ci.value=b.t;drawChat(false);}
  }
}
function send(){if(!CH||CH.busy||CH.ended)return;recStop();const ci=$("#ci");const v=(ci.value||"").trim();if(!v)return;ci.value="";
  CH.n++;CH.bub.push({me:true,t:v});CH.msgs.push({role:"user",content:v});aiTurn();}

function speakCard(){return `<div class="spcard"><div class="spct">🗣️ Konuşma pratiği</div><div class="spcs">Kısa sohbetler ve telaffuz — derslerinle ilgili</div>

let GM=null;
function gameShell(title,hud,body,act){
  window.scrollTo(0,0);
  root().innerHTML=`<div class="nav"><div class="in"><button class="back" id="gx"><span style="width:22px;height:22px;display:grid;place-items:center">${I.x}</span></button><div class="nt">${title}</div><div class="ghud" id="hud">${hud}</div></div></div><div class="page gpage push" id="gp">${body}</div>${act?`<div class="actbar"><div class="in" id="gact">${act}</div></div>`:""}`;

function stopGame(){if(GM){GM.over=true;(GM.timers||[]).forEach(t=>{clearInterval(t);clearTimeout(t);});if(GM.raf)cancelAnimationFrame(GM.raf);}GM=null;stopSpeak();}
function startGame(k){stopGame();tabs(false);IN_LESSON=true;GM={k,over:false,timers:[]};({ninja:gNinja,rain:gRain,memory:gMemory,wortle:gWortle,hoer:gHoer,race:gRace})[k]();}
function endGame(k,score,detail){
  if(!GM||GM.ended)return;GM.ended=true;const was=(S.games=S.games||{})[k]||0;const rec=score>was;if(rec)S.games[k]=score;
  const xp=Math.max(2,Math.round(score/10));S.xp=(S.xp||0)+xp;dqInc("games");touch();save();checkBadges();
  const g=GAMES.find(x=>x[0]===k);stopGame();GM={k,ended:true,over:true,timers:[]};

  root().innerHTML=`<div class="page fade center" style="padding-top:36px;padding-bottom:170px"><div style="font-size:76px">${g[2]}</div><div class="h2" style="font-size:28px;margin-top:6px">${rec&&score>0?"Yeni rekor!":"Oyun bitti"}</div>
  <div class="gscore">${score}</div><div class="sub">${detail||""}</div><div class="mt"><span class="pill blue">+${xp} XP</span> <span class="pill">Rekor: ${Math.max(was,score)}</span></div></div>
  <div class="actbar"><div class="in"><button class="btn sec" id="gh">Oyunlar</button><button class="btn" id="ga">Tekrar oyna</button></div></div>`;

/* 1) Artikel Ninja */

/* 2) Kelime Yağmuru */
function gRain(){
  const ws=gWords();if(ws.length<6){toast("Önce birkaç ders bitir");tab="games";render();return;}
  let lives=3,score=0,drops=[],speed=38,spawnEvery=2600,last=0,lastSpawn=-9999,id=0,caught=0;
  gameShell("Kelime Yağmuru",`<span class="hchip">${"❤️".repeat(lives)}</span>`+hudScore(0),`<div class="rain" id="rz"><div class="rground"></div></div>`,`<div class="ropts" id="ro"></div>`);
  const rz=$("#rz");
  const hud=()=>{$("#hud").innerHTML=`<span class="hchip">${"❤️".repeat(Math.max(0,lives))}${"🤍".repeat(3-Math.max(0,lives))}</span>`+hudScore(score);};
  const front=()=>drops.filter(d=>!d.dead).sort((a,b)=>b.y-a.y)[0];
  let shownFor=null;
  const showOpts=()=>{const f=front();if(!f){$("#ro").innerHTML="";shownFor=null;return;}if(shownFor===f.id)return;shownFor=f.id;
    $("#ro").innerHTML=opts4(f.w[1],ws.map(x=>x[1])).map(o=>`<button class="ropt" data-o="${esc(o)}">${esc(o)}</button>`).join("");
    $("#ro").querySelectorAll(".ropt").forEach(b=>b.onclick=()=>{const g=front();if(!g||GM.over)return;
      if(b.dataset.o===g.w[1]){g.dead=true;caught++;score+=10+Math.round((1-g.y/100)*10);sfx("ok");dqInc("ok");g.el.classList.add("pop");say(g.w[0]);setTimeout(()=>g.el.remove(),300);speed+=1.2;spawnEvery=Math.max(1100,spawnEvery-60);}
      else{lives--;sfx("bad");b.classList.add("bad");g.el.classList.add("shake");setTimeout(()=>g.el.classList.remove("shake"),400);if(lives<=0)return endGame("rain",score,`${caught} kelime yakaladın`);}
      hud();shownFor=null;showOpts();});};
  const spawn=()=>{const w=ws[Math.random()*ws.length|0];const el=document.createElement("div");el.className="drop";el.innerHTML=fmt(w[0]);el.style.left=(8+Math.random()*60)+"%";rz.appendChild(el);drops.push({w,y:0,el,id:++id});};
  const loop=ts=>{if(!GM||GM.over)return;if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;
    if(ts-lastSpawn>spawnEvery||!drops.some(d=>!d.dead)){spawn();lastSpawn=ts;}
    drops.forEach(d=>{if(d.dead||!GM||GM.over)return;d.y+=speed*dt*(100/ (rz.clientHeight||400))*4;d.el.style.transform=`translateY(${d.y/100*(rz.clientHeight-60)}px)`;
      if(d.y>=100){d.dead=true;d.el.classList.add("splash");setTimeout(()=>d.el.remove(),400);lives--;sfx("bad");hud();toast(`${noArt(d.w[0])} = ${d.w[1]}`);if(lives<=0){endGame("rain",score,`${caught} kelime yakaladın`);}}});
    if(!GM||GM.over)return;drops=drops.filter(d=>!d.dead||d.el.isConnected);showOpts();GM.raf=requestAnimationFrame(loop);};
  GM.raf=requestAnimationFrame(loop);
}
/* 3) Hafıza Kartları */
function gMemory(){
  const ws=shuffle(gWords()).filter(w=>noArt(w[0]).length<16&&w[1].length<22).slice(0,6);if(ws.length<6){toast("Önce birkaç ders bitir");tab="games";render();return;}
  const cards=shuffle(ws.flatMap((w,i)=>[{i,t:w[0],de:1},{i,t:w[1],de:0}]));
  let open=[],moves=0,found=0,t0=Date.now(),lock=false;

/* 4) Wort-Rätsel */
function gWortle(){
  const up=s=>s.toLocaleUpperCase(LANG.loc).replace(/ẞ/g,"ß");
  const cand=[...gWords(),...UNITS.filter(u=>u.lv==="A1"||u.lv==="A2").flatMap(u=>u.w)].map(w=>[noArt(w[0]),w[1]]).filter(([d])=>LANG.w5.test(d));
  if(!cand.length){toast("Uygun kelime yok");tab="games";render();return;}
  const [word,tr]=cand[Math.random()*cand.length|0];const W=up(word);
  let row=0,cur="",done=false,hint=false;const rows=[];
  const KB=LANG.kb;const keyState={};
  gameShell(LANG.gw,"",`<div class="wgrid" id="wg">${Array.from({length:6},(_,r)=>`<div class="wrow" data-r="${r}">${Array.from({length:5},()=>`<div class="wcell"></div>`).join("")}</div>`).join("")}</div>
    <button class="whint" id="wh">💡 İpucu: Türkçe anlamını göster</button><div class="wkb" id="kb"></div>`,"");
  const drawKB=()=>{$("#kb").innerHTML=KB.map(r=>`<div class="wkr">${[...r].map(k=>`<button class="wk ${keyState[k]||""} ${k==="↵"||k==="⌫"?"wide":""}" data-k="${k}">${k==="↵"?"Gir":k}</button>`).join("")}</div>`).join("");
    $("#kb").querySelectorAll(".wk").forEach(b=>b.onclick=()=>press(b.dataset.k));};
  const paint=()=>{const r=root().querySelector(`.wrow[data-r="${row}"]`);if(!r)return;[...r.children].forEach((c,i)=>{c.textContent=cur[i]||"";c.classList.toggle("filled",!!cur[i]);});};
  const press=k=>{if(done||GM.over)return;if(k==="⌫"){cur=cur.slice(0,-1);paint();return;}if(k==="↵")return submit();if(cur.length<5){cur+=k;sfx("tap");paint();}};
  const submit=()=>{if(cur.length<5){const r=root().querySelector(`.wrow[data-r="${row}"]`);r.classList.add("shake");setTimeout(()=>r.classList.remove("shake"),400);return;}
    const res=Array(5).fill("absent"),pool=[...W];for(let i=0;i<5;i++)if(cur[i]===W[i]){res[i]="correct";pool[i]=null;}
    for(let i=0;i<5;i++)if(res[i]!=="correct"){const j=pool.indexOf(cur[i]);if(j>=0){res[i]="present";pool[j]=null;}}
    const r=root().querySelector(`.wrow[data-r="${row}"]`);[...r.children].forEach((c,i)=>{setTimeout(()=>{c.classList.add("rev",res[i]);},i*140);});
    [...cur].forEach((ch,i)=>{const p=keyState[ch];if(res[i]==="correct"||p!=="correct"&&(res[i]==="present"||!p))keyState[ch]=res[i];});
    setTimeout(()=>{drawKB();if(cur===W){done=true;sfx("ok");dqInc("ok");say(word);const score=(6-row)*25+(hint?0:20);setTimeout(()=>endGame("wortle",score,`${word} = ${tr} · ${row+1}. denemede`),900);}
      else if(row===5){done=true;sfx("bad");say(word);setTimeout(()=>endGame("wortle",0,`Kelime: ${word} = ${tr}`),900);}else{row++;cur="";}},5*140+200);};
  $("#wh").onclick=()=>{hint=true;$("#wh").textContent="💡 "+tr;$("#wh").disabled=true;};
  drawKB();
  const kd=e=>{if(!GM||GM.k!=="wortle"||GM.over){document.removeEventListener("keydown",kd);return;}if(e.key==="Enter")press("↵");else if(e.key==="Backspace")press("⌫");else if(LANG.keyRe.test(e.key))press(up(e.key));};
  document.addEventListener("keydown",kd);
}

      const sec=(Date.now()-t0)/1000;if(b.dataset.o===w[0]){ok++;streak++;const pts=10+Math.max(0,Math.round(10-sec*2))+(streak>=3?5:0);score+=pts;sfx("ok");dqInc("ok");$("#hm").textContent=`+${pts}${streak>=3?" · seri bonusu!":""} · ${w[1]}`;}
      else{streak=0;b.classList.add("bad");sfx("bad");$("#hm").textContent=`${noArt(w[0])} = ${w[1]}`;}

function gRace(){
  const ss=shuffle(gSents());if(ss.length<3){toast("Önce birkaç ders bitir");tab="games";render();return;}
  let t=90,score=0,k=0,done=0;
  gameShell("Cümle Yarışı",hudTime(t)+hudScore(0),`<div class="qp" id="rq" style="font-size:22px"></div><div class="tiles ans" id="ans"></div><div class="tiles" id="bank"></div>`,`<button class="btn sec" id="sk">Geç</button><button class="btn" id="ck" disabled>Kontrol et</button>`);
  const hud=()=>{$("#hud").innerHTML=hudTime(t)+hudScore(score);};
  let s,toks,seq;
  const load=()=>{s=ss[k%ss.length];k++;toks=tokenize(s[0]);seq=[];$("#rq").textContent=s[1];const bank=$("#bank");bank.innerHTML=shuffle(toks.map((x,j)=>({x,j}))).map(o=>`<button class="tile" data-j="${o.j}">${esc(o.x)}</button>`).join("");upd();
    bank.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const rr=b.getBoundingClientRect();seq.push(+b.dataset.j);b.classList.add("used");upd();flyIn(rr,$("#ans").lastElementChild);sfx("tap");if(seq.length===toks.length)check();});};
  const upd=()=>{const ans=$("#ans");ans.innerHTML=seq.map((j,n)=>`<button class="tile" data-n="${n}">${esc(toks[j])}</button>`).join("");$("#ck").disabled=!seq.length;
    ans.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const j=seq.splice(+b.dataset.n,1)[0];$("#bank").querySelector(`[data-j="${j}"]`).classList.remove("used");upd();});};
  const check=()=>{const got=seq.map(j=>toks[j]).join(" ");if(norm(got)===norm(toks.join(" "))){done++;score+=toks.length*10;sfx("ok");dqInc("ok");say(s[0]);$("#ans").classList.add("good");setTimeout(()=>{$("#ans").classList.remove("good");if(!GM.over)load();},500);}
    else{sfx("bad");$("#ans").classList.add("shake");setTimeout(()=>$("#ans").classList.remove("shake"),420);}hud();};
  $("#ck").onclick=check;$("#sk").onclick=()=>{toast(s[0]);load();};
  GM.timers.push(setInterval(()=>{if(GM.over)return;t--;hud();if(t<=10)$("#gp").classList.add("hurry");if(t<=0)endGame("race",score,`${done} cümle kurdun`);},1000));
  load();
}

/* ===== Örnek cümle havuzu ===== */
const ALLS=[];
UNITS.forEach(u=>{u.x=(window.X&&X[u.key])||[];u.sents=[...u.p.map(p=>[p[0],p[1]]),...u.x];
  [...u.w.map(w=>[w[3],w[4]]),...u.p,...u.x].forEach(s=>ALLS.push({de:s[0],tr:s[1],u}));});
const SEP=["auf","an","ein","aus","mit","zurück","vor","fern","ab","um","zu","weg","nach","vorbei","her","hin","los"];
const VEND={en:/(ing|ed|es|s)$/,fr:/(er|ir|re|ez|ent|ons)$/,it:/(are|ere|ire|arsi|ersi|irsi)$/};
function wordMatcherG(w){
  let b=noArt(w).replace(/^(se |s'|s’|to )/i,"").trim();const low=b.toLowerCase();
  if(low.includes(" ")||low.includes("…"))return s=>s.toLowerCase().includes(low.split("…")[0].trim());
  const re=VEND[LANG.code];let stem=re&&low.length>4?low.replace(re,""):low;if(stem.length<3)stem=low;
  const minStem=stem.length>=4?stem:low;
  return s=>{const t=(s.toLowerCase().match(/\p{L}+/gu)||[]);return t.some(x=>x===low||(minStem.length>=4&&x.startsWith(minStem)));};
}
function wordMatcher(w){
  if(LANG.code!=="de")return wordMatcherG(w);
  let b=noArt(w).replace(/^sich /i,"").trim();
  const low=b.toLowerCase();
  if(low.includes(" ")||low.includes("…"))return s=>s.toLowerCase().includes(low.split("…")[0].trim());
  const verb=/^[a-zäöüß]/.test(b)&&/(en|ern|eln)$/.test(low)&&low.length>4;
  let stem=verb?low.replace(/(en|n)$/,""):low;
  let pre=null,rest=null;
  if(verb)for(const p of SEP)if(stem.startsWith(p)&&stem.length>p.length+2){pre=p;rest=stem.slice(p.length);break;}
  const minStem=stem.length>=4?stem:low;
  return s=>{const t=(s.toLowerCase().match(/[a-zäöüß]+/g)||[]);
    if(t.some(x=>x===low||(minStem.length>=4&&x.startsWith(minStem))))return true;
    if(pre&&t.includes(pre)&&t.some(x=>x.startsWith(rest.slice(0,Math.max(3,rest.length-1)))))return true;
    if(verb&&t.some(x=>x==="ge"+stem+"t"||x.startsWith("ge"+stem)))return true;
    return false;};
}
function examplesFor(w,u){
  const m=wordMatcher(w[0]);const out=[[w[3],w[4]]];const seen=new Set([w[3]]);
  const add=s=>{if(out.length<5&&!seen.has(s.de)&&m(s.de)){out.push([s.de,s.tr]);seen.add(s.de);}};
  ALLS.filter(s=>s.u===u).forEach(add);ALLS.filter(s=>s.u!==u&&s.u.gi<u.gi).forEach(add);ALLS.filter(s=>s.u.gi>u.gi).forEach(add);
  return out;
}

/* ===== Ders planı (bölümler) ===== */
function plan(u){
  const segs=[{t:"g"}];
  for(let i=0;i<u.w.length;i+=3)segs.push({t:"w",ws:u.w.slice(i,i+3),from:i});
  const s=u.sents,h=Math.ceil(s.length/2);
  segs.push({t:"s",ss:s.slice(0,h)});segs.push({t:"s",ss:s.slice(h)});
  segs.push({t:"f"});

}

const isNoun=w=>isNounStr(w[0]);

function blankOf(sent,word){
  const core=noArt(word).replace(/^sich /i,"");const forms=[word,core];
  for(const f of forms){const i=sent.toLowerCase().indexOf(f.toLowerCase());
    if(i>=0){const pre=sent.slice(0,i),post=sent.slice(i+f.length);
      if((i===0||/[\s(„"]/.test(pre.slice(-1)))&&!/^\p{L}/u.test(post))return{pre,post,ans:sent.slice(i,i+f.length)};}}
  return null;
}
function exWord(w,u,stage,avoid){
  const types=stage===0?["de2tr","listen"]:["tr2de","blank","type"];
  if(stage===0&&LANG.arts&&isNoun(w)&&LANG.arts.includes(artOf(w[0])))types.push("art");
  let t=shuffle(types.filter(x=>x!==avoid))[0]||types[0];
  const ex=examplesFor(w,u);
  if(t==="blank"){const b=ex.map(e=>({e,b:blankOf(e[0],w[0])})).find(o=>o.b);if(!b)t="tr2de";else{
    const ans=b.b.ans,withArt=LANG.artRe.test(ans),cap=/^\p{Lu}/u.test(ans);

    const opts=[ans];d.forEach(x=>{if(!opts.some(o=>o.toLowerCase()===x.toLowerCase()))opts.push(x);});
    return{t,w,prompt:`${esc(b.b.pre)}<span class="blank">&nbsp;</span>${esc(b.b.post)}`,sub:"Boşluğa ne gelir? · "+esc(b.e[1]),ans,opts:shuffle(opts),say:b.e[0],show:b.e,plain:1};}}
  if(t==="type"&&(w[0].split(" ").length>3||w[0].includes("…")||w[0].includes(" / ")))t="tr2de";
  if(t==="de2tr")return{t,w,prompt:fmt(w[0]),sub:"Türkçesi hangisi?",ans:w[1],opts:shuffle([w[1],...distW(w,u,x=>x[1])]),say:w[0],plain:1,auto:1};
  if(t==="listen")return{t,w,sub:"Dinle ve duyduğunu seç",ans:w[0],opts:shuffle([w[0],...distW(w,u,x=>x[0])]),say:w[0],auto:1};
  if(t==="tr2de")return{t,w,prompt:esc(w[1]),sub:LANG.si+" hangisi?",ans:w[0],opts:shuffle([w[0],...distW(w,u,x=>x[0])]),say:w[0]};

  return{t:"type",w,prompt:esc(w[1]),sub:LANG.sini+" yaz"+(m?` · artikeliyle (${esc(m[1].trim())})`:""),ans:w[0],say:w[0]};

function exSent(s,u,avoid){
  const toks=tokenize(s[0]);

  if(toks.length>11)types=["tr","build"];
  const bw=u.w.find(w=>blankOf(s[0],w[0]));if(bw)types.push("sblank");
  let t=shuffle(types.filter(x=>x!==avoid))[0]||"tr";
  const others=u.sents.filter(x=>x[0]!==s[0]);
  if(t==="tr"){const d=shuffle(others).map(x=>x[1]).filter(x=>x!==s[1]).slice(0,3);
    if(d.length<3)ALLS.filter(x=>x.u.lv===u.lv&&x.tr!==s[1]).slice(0,40).forEach(x=>{if(d.length<3&&!d.includes(x.tr))d.push(x.tr);});
    return{t,s,prompt:tapS(s[0]),sub:"Bu cümle ne demek?",ans:s[1],opts:shuffle([s[1],...d]),say:s[0],plain:1,auto:1,tap:1};}
  if(t==="sblank"){const b=blankOf(s[0],bw[0]);const d=distW(bw,u,x=>noArt(x[0])).map(x=>/^\p{Lu}/u.test(b.ans)?x.charAt(0).toUpperCase()+x.slice(1):x);const opts=[b.ans];d.forEach(x=>{if(!opts.some(o=>o.toLowerCase()===x.toLowerCase()))opts.push(x);});
    return{t,s,prompt:`${esc(b.pre)}<span class="blank">&nbsp;</span>${esc(b.post)}`,sub:"Boşluğa ne gelir? · "+esc(s[1]),ans:b.ans,opts:shuffle(opts),say:s[0]};}
  const extra=t==="build"?shuffle(others.flatMap(x=>tokenize(x[0])).filter(x=>!toks.includes(x))).filter((x,i,a)=>a.indexOf(x)===i).slice(0,Math.min(3,Math.max(2,toks.length>>1))):[];
  return{t,s,prompt:t==="build"?esc(s[1]):"",sub:t==="build"?LANG.name+" cümleyi kur":"Dinle ve cümleyi kur",ans:toks.join(" "),tokens:[...toks,...extra],say:s[0],auto:t==="listen"};
}

let IN_LESSON=false;
function lesson(gi,restart){
  tabs(false);IN_LESSON=true;S.lastU=gi;
  const u=UNITS[gi],P=plan(u);
  S.lp=S.lp||{};
  let si=restart?0:Math.min(S.lp[u.key]||0,P.length-1);
  if(S.pass[u.key]&&!restart&&!S.lp[u.key])si=0;
  if(si>0)toast("Kaldığın yerden devam: "+(si+1)+". bölüm");
  const stat={first:0,ok:0};
  function shell(title,body,act,prog,cnt){
    window.scrollTo(0,0);
    root().innerHTML=`<div class="nav"><div class="in"><button class="back" id="nb"><span style="width:22px;height:22px;display:grid;place-items:center">${I.x}</span></button><div class="nt">${esc(title)}</div><button class="cnt rulebtn" id="rb">Kural</button></div><div class="prog"><i style="width:${prog*100}%"></i></div></div>`+

  }
  const segTitle=()=>`${u.lv} ${u.n} · ${segName(P[si])} ${si+1}/${P.length}`;
  function nextSeg(){si++;dqInc("seg");S.lp[u.key]=si;touch();save();if(si>=P.length)return finish();if(snackDue(u,P[si-1].t))return snack(u,runSeg);runSeg();}
  function runSeg(){
    const sg=P[si];
    if(sg.t==="g")return grammar();

  function grammar(){

  }
  function intro(w,k,n,go){

      <div class="card stack"><div class="wordline"><div style="flex:1;min-width:0"><div class="word">${fmt(w[0])}</div><div class="pron">/${esc(w[2])}/</div></div>${spk(w[0])}</div>
      <div class="mean">${esc(w[1])}</div></div>

      <div class="sec-f" style="margin:0 4px">Örnekleri sesli oku. Birazdan bu kelimeyi farklı şekillerde soracağım.</div></div>`,

  /* ortak soru döngüsü: items = [{kind,obj,need,stage,last}], doğru yapana kadar tekrar */
  function drill(items,mk,onDone,label){

    const firstSeen=new Set();

    function ask(it){

      }else if(Q.t==="type"){

      }else{

        <div class="opts">${Q.opts.map((o,j)=>`<button class="opt" data-o="${esc(o)}"><span class="l">${"ABCD"[j]}</span><span>${Q.plain?esc(o):fmt(o)}</span></button>`).join("")}</div></div>`;

      const ls=$("#ls");if(ls){ls.onclick=()=>say(Q.say);$("#lss").onclick=()=>say(Q.say,true);}
      const fin=(ok,note)=>result(it,Q,ok,note);
      if(Q.tokens){const ans=$("#ans"),bank=$("#bank"),chk=$("#chk"),seq=[];
        const upd=()=>{ans.innerHTML=seq.map((j,n)=>`<button class="tile" data-n="${n}">${esc(Q.tokens[j])}</button>`).join("");chk.disabled=!seq.length;
          ans.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const rr=b.getBoundingClientRect();const j=seq.splice(+b.dataset.n,1)[0];const bt=bank.querySelector(`[data-j="${j}"]`);bt.classList.remove("used");upd();flyIn(rr,bt);});};
        bank.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const rr=b.getBoundingClientRect();seq.push(+b.dataset.j);b.classList.add("used");upd();flyIn(rr,ans.lastElementChild);sfx("tap");});
        chk.onclick=()=>{const got=seq.map(j=>Q.tokens[j]).join(" ");const ok=norm(got)===norm(Q.ans);root().querySelectorAll(".tile").forEach(t=>t.disabled=true);fin(ok,ok&&got!==Q.ans?"Büyük harf / noktalamaya dikkat. ":"");};}
      else if(Q.t==="type"){const inp=$("#inp");setTimeout(()=>{try{inp.focus();}catch(e){}},60);
        const check=()=>{const v=inp.value.trim();if(!v)return;const a=Q.ans;const exact=v.toLowerCase()===a.toLowerCase()||v.toLowerCase()===noArt(a).toLowerCase()&&!/^(der|die|das) /.test(a);const loose=norm(v)===norm(a)||(!/^(der|die|das) /.test(a)&&norm(v)===norm(noArt(a)));inp.disabled=true;inp.classList.add(loose?"ok":"bad");fin(loose,loose&&!exact?"Umlaut / ß yazımına dikkat. ":"");};
        $("#chk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check();};$("#skip").onclick=()=>{inp.disabled=true;inp.classList.add("bad");fin(false,"");};}

    }
    function result(it,Q,ok,note){

      S.xp+=ok?2:0;save();

      const de=it.kind==="w"?it.obj[0]:it.obj[0],tr=it.obj[1];

      ab.innerHTML=`<div class="in" style="display:block"><div class="fbt">${ok?pick(["Sehr gut!","Richtig!","Super!","Genau!","Toll!"]):"Doğru cevap:"}</div>
        <div class="fbs">${note?`<span class="sub">${esc(note)}</span>`:""}<b>${it.kind==="w"?fmt(de):esc(de)}</b>${it.kind==="w"?" /"+esc(it.obj[2])+"/":""} · ${esc(tr)}
        ${shown&&it.kind==="w"?`<div class="fbx">${esc(shown[0])}<br><span class="sub">${esc(shown[1])}</span></div>`:""}
        ${ok?"":`<div class="sub" style="font-size:13px;margin-top:4px">Bunu birazdan tekrar soracağım.</div>`}</div>
        <button class="btn ${ok?"green":"red"}" id="go">Devam</button></div>`;

  function words(sg){
    const ws=sg.ws;let k=0;

      drill(shuffle(items.slice(0,ws.length)).concat(items.slice(ws.length)),it=>exWord(it.obj,u,Math.min(it.stage,1),it.last),()=>match(ws.concat(prev).slice(0,5),nextSeg),"Alıştırma");

      <div class="mgrid"><div class="mcol">${L.map(o=>`<button class="mt2" data-s="L" data-i="${o.i}">${fmt(o.t)}</button>`).join("")}</div><div class="mcol">${R.map(o=>`<button class="mt2" data-s="R" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div></div></div>`,"",(si+0.95)/P.length,"");

        if(!left){const ab=$("#ab");ab.className="actbar ok";ab.innerHTML=`<div class="in" style="display:block"><div class="fbt">Hepsi doğru!</div><button class="btn green" id="go">Devam</button></div>`;$("#go").onclick=go;}}
      else{const a=sel;sfx("bad");[a,b].forEach(x=>x.classList.add("wrong"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("wrong","on")),450);sel=null;}

  function finish(){

    const pct=stat.first?Math.round(stat.ok/stat.first*100):100,first=!S.pass[u.key];
    S.pass[u.key]=1;S.best[u.key]=Math.max(S.best[u.key]||0,pct);delete S.lp[u.key];

    const gain=20+(first?50:0);S.xp+=gain;touch();save();
    const nx=UNITS[gi+1];
    window.scrollTo(0,0);setTimeout(()=>{confetti();sfx("win");},150);
    root().innerHTML=`<div class="page fade center" style="padding-top:30px;padding-bottom:160px">
      ${ring(pct/100,170,pct>=80?"var(--green)":"var(--orange)","%"+pct,"ilk seferde doğru")}
      <div class="h2" style="font-size:28px;margin-top:12px">Geschafft!</div>
      <div class="sub">${esc(u.t)} tamamlandı. ${u.w.length} kelime ve ${u.sents.length} cümleyle çalıştın.</div>
      <div class="mt"><span class="pill blue">+${gain} puan</span></div>
      <div class="sec-f" style="margin-top:14px">Zorlandığın kelimeler Tekrar sekmesinde daha sık karşına çıkacak.</div><button class="btn sec" id="spk2" style="margin-top:18px">🗣️ Bu konuyla konuş</button></div>

/* ===== Questions ===== */
function tokenize(s){return s.replace(/\s+([?!:;»])/g," $1").split(" ").filter(Boolean);}
function qWord(w,pool){
  const others=shuffle(pool.filter(x=>x[0]!==w[0]&&x[1]!==w[1]));const d=others.slice(0,3);
  const low=w[3].toLowerCase(),i=low.indexOf(w[0].toLowerCase());

  if(t==="listen")return{t,key:w[0],w,prompt:"",sub:"Dinle ve duyduğunu seç",ans:w[0],opts:shuffle([w[0],...d.map(x=>x[0])]),say:w[0]};

}

function runQuiz(qs,title,backLabel,onEnd){

  function draw(){

      body=`<div class="stack fade"><div class="qs">${q.sub}</div><div class="qp">${q.prompt}</div>

    }else{
      body=`<div class="stack fade"><div class="card stack">${q.t==="listen"?`<button class="sbtn bigspk" id="ls" aria-label="Tekrar dinle">${I.spk}</button><button class="btn sec small" style="margin:0 auto" id="lss">Yavaş dinle</button>`:`<div class="qp">${q.prompt}</div>`}<div class="qs ${q.t==="listen"?"center":""}">${q.sub}</div></div>

  const imp=w.match(/^(.+?)(a|e|i)(le|la|lo|ci|mi|ne)$/);if(imp)o.push(imp[1]+"are",imp[1]+"ere",imp[1]+"ire");
  const ger=w.match(/^(.+?)(ando|endo)$/);if(ger)o.push(ger[1]+"are",ger[1]+"ere",ger[1]+"ire");

};
function lemmas(w){if(LANG.code!=="de"){const out=[w];if(IRR[w])out.push(IRR[w]);const m=LANG.code==="en"?null:w.match(/^[^'’]+['’](.+)$/);
  const ws=m?[w,m[1]]:[w];ws.forEach(x=>{if(x!==w){out.push(x);if(IRR[x])out.push(IRR[x]);}const g=(LEMG[LANG.code]||(()=>[]))(x);g.forEach(y=>{out.push(y);if(IRR[y])out.push(IRR[y]);});});return out;}
  const out=[w];if(IRR[w])out.push(IRR[w]);
  const E=["test","tet","ten","est","ste","sten","st","te","et","en","em","er","es","e","n","s","t"];
  for(const e of E)if(w.length>e.length+2&&w.endsWith(e)){const st=w.slice(0,-e.length);out.push(st+"en",st+"n",st,st+"e");}
  if(w.startsWith("ge")&&w.length>5){const r=w.slice(2);out.push(r.replace(/(e?t|en)$/,"")+"en",r);}

function findLex(phrase){const p=lk(phrase);if(LEX.has(p))return{e:LEX.get(p),q:p};
  if(!p.includes(" ")){const L=lemmas(p);for(const c of L){if(LEX.has(c))return{e:LEX.get(c),q:p,lem:c};}
    for(const c of L){for(const k of ["sich "+c])if(LEX.has(k))return{e:LEX.get(k),q:p,lem:k};}
    for(const c of L){if(c!==p&&FUNC[c])return{e:{fr:c,tr:FUNC[c],pr:""},q:p,lem:c};}
    if(FUNC[p])return{e:{fr:p,tr:FUNC[p],pr:""},q:p};
    if(p.includes("-")){const f=p.split("-")[0];for(const c of lemmas(f))if(LEX.has(c))return{e:LEX.get(c),q:p,lem:c};}}

const WRE=/[A-Za-zÀ-ÖØ-öø-ÿĀ-ž0-9]+(?:['’\-/][A-Za-zÀ-ÖØ-öø-ÿĀ-ž0-9]+)*|[^A-Za-zÀ-ÖØ-öø-ÿĀ-ž0-9]+/g;
const toks=s=>s.match(WRE)||[];
const isW=t=>/[A-Za-zÀ-ÿĀ-ž]/.test(t);
function tapS(s){let wi=0;return `<span class="tsent" data-sent="${esc(s)}">${toks(s).map(t=>isW(t)?`<span class="tw" data-wi="${wi++}" role="button" tabindex="0">${esc(t)}</span>`:esc(t)).join("")}</span>`;}

function gloss(sent,wi,el){

  for(let len=Math.min(5,ws.length);len>=1&&!best;len--){for(let st=Math.max(0,wi-len+1);st<=wi&&st+len<=ws.length;st++){const ph=join(ws.slice(st,st+len));if(len>1&&ph.split(/\s|'/).length<2)continue;const r=findLex(ph);if(r&&(len>1||true)){best={r,st,len};break;}}}
  const holder=el.closest(".tsent");holder.querySelectorAll(".tw").forEach(x=>x.classList.remove("on"));
  const word=ws[wi];
  if(best)for(let i=best.st;i<best.st+best.len;i++){const x=holder.querySelector(`[data-wi="${i}"]`);if(x)x.classList.add("on");}else el.classList.add("on");
  const shown=best?join(ws.slice(best.st,best.st+best.len)):word;

  let g=$("#gloss");if(!g){g=document.createElement("div");g.id="gloss";g.className="gloss";document.body.appendChild(g);}
  g.innerHTML=`<div class="in" role="dialog" aria-label="Kelime anlamı"><div style="flex:1;min-width:0"><div class="gw">${esc(shown)}</div>${base}<div class="gt">${e?esc(e.tr):"Bu biçim sözlükte yok, cümlenin çevirisine bak. (Büyük harfle başlıyorsa isim ya da özel ad olabilir.)"}</div>${(e&&e.pr)||g2p(shown)?`<div class="gl">/${esc((e&&e.pr)||shown.split(/\s+/).map(g2p).join(" "))}/</div>`:""}</div><button class="sbtn sm" data-say="${esc(shown)}" aria-label="Dinle">${I.spk}</button><button class="gx" id="gx" aria-label="Kapat">${I.x}</button></div>`;
  bindSay(g);$("#gx").onclick=closeGloss;say(shown);
}
function closeGloss(){const g=$("#gloss");if(g)g.remove();document.querySelectorAll(".tw.on").forEach(x=>x.classList.remove("on"));}
